# Every party addresses this AP as 127.0.0.1:9618: the AP host itself, and EPs
# through their local forwarder to the tailnet (backlog decision-1). The AP
# listens on loopback only; `tailscale serve` (ap/tailnet.sh) exposes it to the
# tailnet. Must sort after 11-ap-annex.conf, which sets its own ANNEX_COLLECTOR.
NETWORK_INTERFACE = 127.0.0.1
BIND_ALL_INTERFACES = false
ENABLE_IPV6 = false

# Annex EPs report here, and so do the condor tools by default.
ANNEX_COLLECTOR = 127.0.0.1:9618?sock=ap_collector
COLLECTOR_HOST = $(ANNEX_COLLECTOR)
